<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>南京文脉 - HistMap</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css?v=20260824l">
</head>
<body>
  <!-- Loading -->
  <div class="loading-overlay" id="loading">
    <div class="loading-spinner"></div>
    <p>加载南京文脉数据中…</p>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <span class="header-icon">山</span>
      <h1 class="app-title">南京文脉</h1>
    </div>
    <div class="header-right">
      <span class="point-count" id="point-count"></span>
      <button class="panel-toggle" id="panel-toggle" aria-label="切换时间轴">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Map -->
  <main id="map"></main>

  <!-- Bottom Panel -->
  <div class="bottom-panel" id="bottom-panel">
    <div class="panel-grabber"></div>

    <!-- Timeline -->
    <div class="timeline-section">
      <div class="dynasty-labels" id="dynasty-labels"></div>
      <div class="slider-container">
        <div class="slider-track" id="slider-track">
          <div class="slider-range" id="slider-range"></div>
          <div class="slider-handle slider-handle-start" id="slider-start">
            <div class="handle-grip"></div>
          </div>
          <div class="slider-handle slider-handle-end" id="slider-end">
            <div class="handle-grip"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Category Filter -->
    <div class="category-section" id="category-section"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="js/app.js?v=20260824n"></script>
</body>
</html>
